# CI Gate — thin wrapper over the org reusable gate.
#
# `shared-gate` runs markdown lint, file size, and fmt/init/validate/tflint
# (`tofu_ci`, gated on the `terraform` filter) from dryvist/.github. The
# local `gate` job keeps the bare `Merge Gate` context this repo's ruleset
# requires; it aggregates the shared gate's result.
#
# Adding a repo-local check: add a job here and list it in `gate.needs` and
# `allowed-skips`.

name: CI Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  shared-gate:
    permissions:
      contents: read
      pull-requests: read
      # The org gate's queue watchdog cancels stuck sibling jobs via the
      # Actions API; a called workflow can never exceed the caller's grant, so
      # actions: write must be granted here or the run fails at graph
      # validation (startup_failure).
      actions: write
    uses: dryvist/.github/.github/workflows/_ci-gate.yml@main
    with:
      tofu_ci: true
      filters: |
        markdown:
          - '**.md'
          - '.markdownlint*'
        terraform:
          - '**.tf'
          - '**.tfvars'
          - '.terraform.lock.hcl'
          - '.tflint.hcl'
          - 'tests/**'
          # config/*.yml is not inert data: locals.tf reads it with
          # yamldecode(file(...)) and it drives for_each on the repo,
          # ruleset and merge-gate modules. Without this pattern a change
          # to the inventory skips the OpenTofu job entirely, so a
          # malformed entry merges green and fails later on someone
          # else's .tf PR.
          - 'config/**'
          - '.github/workflows/ci-gate.yml'

  # ==========================================================================
  # MERGE GATE - The ONLY required check in branch protection
  # ==========================================================================
  gate:
    name: Merge Gate
    needs: [shared-gate]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check all results
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # release/v1
        with:
          jobs: ${{ toJSON(needs) }}
