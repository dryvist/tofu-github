# Inventory of repos whose per-repo GitHub settings this config manages.
#
# Decoded with yamldecode(file(...)) in locals.tf and consumed by repos.tf
# via for_each. The map key is the repo name; the org owner is implied by the
# single provider's `owner` setting (see providers.tf) and is intentionally
# NOT repeated here — an account login in config/*.yml would violate the
# no-identity-in-source rule. Repo names are governance subjects (the things
# being managed), not identities, so they belong here as structured data.
#
# Schema (per entry):
#   visibility:  "public" | "private". Drives the secret-scanning cost gate:
#                secret scanning + push protection require GitHub Advanced
#                Security on PRIVATE repos (paid), but are free on public. The
#                module enables them ONLY when visibility is "public", so an
#                apply never silently turns on a paid feature. Look up the live
#                value (`gh repo view <repo> --json visibility`) before adding
#                a repo — never assume "public".
#   description: GitHub repo description (1-line, shown on GitHub).
#   topics:      List of GitHub topic tags.
#   archived:    Optional, defaults to false. Set true only for a repo that is
#                permanently frozen — record why (ADR, README banner) and
#                reference it here. One-way: the GitHub API doesn't support
#                unarchiving. See modules/repo-settings/variables.tf for the
#                "most other settings become read-only" caveat.
#   gitflow:     Optional, defaults to false. Set true to opt the repo into the
#                git-flow model: gitflow.tf creates a `develop` branch and
#                makes it the default, and rulesets.tf binds the git-flow main /
#                develop rulesets to it while excluding it from the standard
#                default-branch rulesets. local.gitflow_repos (gitflow.tf) derives
#                the opted-in set from this flag — set it here, nowhere else.
# An entry naming a repo that does not exist yet CREATES it — no flag, no
# ceremony. repos.tf derives adopt-vs-create by intersecting this inventory
# with the live org listing, so an entry reads the same whether the repo
# pre-dates this config or was born from it. A created repo is not
# auto-initialised: it lands empty, ready for a first push, which avoids an
# unrelated-histories collision with content pushed from a local clone.
#
# Per-repo `all`/`main` rulesets are OUT OF SCOPE: the org-level rulesets in
# rulesets.tf already enforce signed commits and Conventional
# Commits on every repo. This config manages only repository *settings*
# (merge methods, auto-merge, branch deletion, wiki, web-commit signoff,
# Dependabot, and the public-only secret-scanning block).
#
# Seeded with the nix-* family ported from the retired `.github-tofu` scaffold,
# then extended with the git-flow pilot repos (terraform-proxmox,
# ansible-proxmox-apps, ai-assistant-instructions). Expanding to every
# non-archived org repo is a follow-up (see the tracking issue).

