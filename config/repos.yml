  #   - this file lives in a PUBLIC repo, so the name and description below
  #     are public permanently. Description is reproduced verbatim from the
  #     live repo so an apply shows no diff. Enrolled deliberately.
  # Default branch is main; not git-flow.
  docs-starlight:
