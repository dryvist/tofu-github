    description: "Private companion docs for the dryvist homelab. Built with Starlight (Astro), deployed to Cloudflare Pages, gated by Cloudflare Access on /d/*."
    topics: []

  # Does not exist on GitHub yet, so this entry creates it. Deliberately NOT
  # git-flow: a policy dataset has no release train to stage, so a single
  # default branch is the honest model, and omitting the flag keeps it bound
  # to the standard org default-branch rulesets instead of the git-flow pair.
  ai-cli-permissions:
    visibility: public
    description: "Tool-agnostic command permission policy for AI coding CLIs — one dataset, JSON Schema validated, rendered per tool"
    topics:
