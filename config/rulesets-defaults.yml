# Shared org-wide policy defaults. Read with yamldecode(file(...)) and expose
# as locals so organization resources use values from config/.

# Consumed by github_organization_ruleset.org_push_protection. Native GitHub
# push rules — enforced at the git layer without any workflow involvement.
push_protection:
  # Hard ceiling on individual file size. Any push containing a single file
  # larger than this is rejected by GitHub before it lands. Repos with a
  # legitimate need for larger files get added to the bypass actor list
  # rather than raising the org-wide ceiling.
  max_file_size_mb: 1

  # Banned file extensions, as fnmatch globs (the integrations/github provider
  # format for restricted_file_extensions). These extensions usually carry
  # credentials or keys; pushes containing files matching any of these globs
  # are rejected at the git layer. Repos that legitimately need to commit one
  # (e.g. a test fixture) put them in a bypass-allowed path or add the actor
  # to bypass.
  banned_file_extensions:
    - "*.env"
    - "*.pem"
    - "*.key"
    - "*.p12"
    - "*.pfx"

# Consumed by restapi_object.org_branch_protection — the
# non-bypassable quality gate on every repo's default branch.
branch_protection:
  # Branch name pattern enforced on every PR. Defined here so the regex
  # can change without editing rulesets.tf.
  branch_name_operator: starts_with
  branch_name_pattern: "(main|develop|feat|fix|hotfix|release|chore)"

  # The commit subject regex is not here: it lives alone in
  # config/commit-message-pattern.txt (see locals.tf) so local commit-msg
  # hooks can read the same single copy.

  # Merge methods allowed on PRs. All merge methods are enabled
  # so contributors can choose the appropriate one for their change.
  allowed_merge_methods:
    - merge
    - squash
    - rebase

# Consumed by restapi_object.org_gitflow_main and
# restapi_object.org_gitflow_develop in rulesets-gitflow.tf for repos opted in
# via `gitflow: true` in the selected org's repos.yml.
# These repos run the git-flow model: develop is the integration default branch
# (feature PRs squash-merge in, back-merges land merge commits) and main is the
# release branch (no direct pushes).
gitflow:
  # Merge methods allowed on PRs into main. Git-flow strictly requires preserving
  # history on the release branch, so only merge commits are allowed.
  main_allowed_merge_methods:
    - merge

  # Integration branch merge methods, in the order the API returns them.
  develop_allowed_merge_methods:
    - merge
    - squash
    - rebase

# Consumed by restapi_object.org_upstream_fork_protection
# (upstream-forks.tf) for repos opted in via `upstream_fork: true` in
# the selected org's repos.yml.
upstream_fork:
  # Merge commits only: an upstream sync must keep upstream's commits as
  # ancestors, or the next sync re-applies them and conflicts. Squash or rebase
  # would rewrite them into org-authored copies.
  allowed_merge_methods:
    - merge

# Shared organization Actions permissions. Keep workflows read-only by default,
# allow all actions, and do not require SHA pinning because first-party refs use
# floating major-version tags.
actions:
  enabled_repositories: all
  allowed_actions: all
  sha_pinning_required: false
  default_workflow_permissions: read
  can_approve_pull_request_reviews: false

# Consumed by github_actions_runner_group.pr_agent in runner-groups.tf.
# Organizations can override these values in runner-groups.yml.
runner_groups:
  self_hosted_runners: true
  selected_workflows:
    - JacobPEvans/.github-ai/.github/workflows/pr-agent.yml@v1
