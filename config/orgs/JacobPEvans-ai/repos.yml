# Per-repo overrides for this organization. Schema: config/orgs/dryvist/repos.yml.
repos:
  ai-agents:
    visibility: public
    description: "Source-of-truth agent skills and instructions, generated for multiple AI coding agents"
    topics:
      - a2a
      - agent-skills
      - ai
      - ai-agents
      - claude-code
      - codex
      - hermes-agent
      - mcp
  pr-automation-fixture:
    visibility: public
    description: "Test fixture for pull request automation"
    topics: []
    allow_update_branch: true
  tau2-bench:
    visibility: public
    fork_of: sierra-research/tau2-bench
    description: "Fork of tau2-bench with CLI flags to pin every model role"
    topics: [benchmark, llm-evaluation]
